services:
  - type: web
    name: aarohi-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    # Add only the provider keys/models you actually have in the Render dashboard.
    # Never put real secrets in this file or commit them to GitHub.
    envVars:
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
